name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语法检查（跟随仓库里全部 js/mjs）
        run: |
          set -e
          git ls-files '*.js' '*.mjs' | grep -v '^docs/' | while read -r file; do
            echo "check $file"
            node --check "$file"
          done

      - name: 校验 JSON 与清单
        run: |
          node -e "for (const f of ['package.json','locale/zh.json','locale/en.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('json ok')"
          node -e "const p=require('./package.json'); if (p.dsh?.bundle?.patch!=='./cordis.patch.yml') throw new Error('bundle patch missing'); if (!p.dsh?.client?.platform) throw new Error('client platform missing'); console.log('manifest ok', p.version)"

      - name: 离线测试（有 test 目录就跑）
        run: |
          if [ -d test ]; then npm test; else echo "no test dir, skip"; fi