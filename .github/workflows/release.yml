name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 语法检查（跟随仓库里全部 js/mjs）
        run: |
          set -e
          git ls-files '*.js' '*.mjs' | grep -v '^docs/' | while read -r file; do
            echo "check $file"
            node --check "$file"
          done

      - name: 校验 JSON 与清单
        run: |
          node -e "for (const f of ['package.json','locale/zh.json','locale/en.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('json ok')"
          node -e "const p=require('./package.json'); if (p.dsh?.bundle?.patch!=='./cordis.patch.yml') throw new Error('bundle patch missing'); if (!p.dsh?.client?.platform) throw new Error('client platform missing'); console.log('manifest ok', p.version)"

      - name: 离线测试（有 test 目录就跑）
        run: |
          if [ -d test ]; then npm test; else echo "no test dir, skip"; fi

      - name: 打包（不含 .git / docs / .github）
        run: |
          NAME="web-scout-${GITHUB_REF_NAME}"
          mkdir -p "dist/${NAME}"
          rsync -a --exclude='.git' --exclude='docs' --exclude='.github' --exclude='_probe' \
                ./ "dist/${NAME}/"
          cd dist
          zip -qr "${NAME}.zip" "${NAME}"
          tar -czf "${NAME}.tar.gz" "${NAME}"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: web-scout-bundle
          path: dist/web-scout-*

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/web-scout-*
          generate_release_notes: true
          body: |
            安装（任选其一）：

            1) npm 一行装：
               `dsh plugin --profile <名字> add dsh-web-scout@${{ github.ref_name }}`
            2) 解压附件后让 DSH 执行
               `plugin_manager action=install_bundle target=<解压目录绝对路径>`

            装完执行一次 `set_bundle target=dsh-web-scout enabled=false` → `enabled=true`，刷新页面即可。

      - name: 发布到 npm（已存在则跳过；发布报错但版本在 registry 上也算通过）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          has_version() { npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; }

          if has_version; then
            echo "npm already has ${NAME}@${VERSION}, skip publish"
            exit 0
          fi

          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::仓库没配 NPM_TOKEN，跳过自动发布；安装仍可用 plugin_manager install_bundle 或手动 npm publish"
            exit 0
          fi

          set +e
          npm publish --provenance --access public
          CODE=$?
          set -e
          echo "npm publish exited with ${CODE}"

          if [ "${CODE}" -ne 0 ]; then
            # registry 有写入延迟，也可能是并发发布已成功（E409），复查后再判失败
            for i in 1 2 3 4 5; do
              sleep 6
              if has_version; then
                echo "${NAME}@${VERSION} 已在 registry 上，视为发布成功"
                exit 0
              fi
            done
            echo "::error::npm 发布失败，且 ${NAME}@${VERSION} 不在 registry"
            exit 1
          fi

          echo "published ${NAME}@${VERSION}"