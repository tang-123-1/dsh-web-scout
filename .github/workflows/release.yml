name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语法检查
        run: |
          for file in index.js api.js engines.js net.js store.js open.js login.js \
                      browserCookies.js browserAuth.js client.js scripts/smoke.mjs; do
            node --check "$file"
          done

      - name: 打包（不含 .git / docs / .github）
        run: |
          NAME="web-scout-${GITHUB_REF_NAME}"
          mkdir -p "dist/${NAME}"
          rsync -a --exclude='.git' --exclude='docs' --exclude='.github' --exclude='_probe' \
                ./ "dist/${NAME}/"
          cd dist
          zip -qr "${NAME}.zip" "${NAME}"
          tar -czf "${NAME}.tar.gz" "${NAME}"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: web-scout-bundle
          path: dist/web-scout-*

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/web-scout-*
          generate_release_notes: true
          body: |
            安装：解压后让 DSH 执行
            `plugin_manager action=install_bundle target=<解压目录绝对路径>`，
            再执行一次 `set_bundle target=@local/web-scout enabled=false` → `enabled=true`，刷新页面即可。